# Tell tmux what terminal type to advertise to programs running inside it.
# Without this, terminal feature negotiation (colors, bracketed paste, etc.)
# can silently misbehave, e.g. pasted text showing a literal ESC[200~ prefix.
set -g default-terminal "tmux-256color"

# Mouse support: scroll wheel for scrollback, click to select pane/window,
# drag to resize panes and to select text (enters copy-mode automatically).
set -g mouse on

# vi-style navigation and selection in copy-mode (prefix + [).
set -g mode-keys vi

# Forward copy-mode yanks (and mouse-drag selections) to the terminal via
# OSC52, so they land on the system clipboard on terminals that support it.
set -g set-clipboard on

# Status bar: show the host tmux is actually running on.
set -g status-left "#[fg=cyan,bold]#H #[default]"
