# Mouse support: scroll wheel for scrollback, click to select pane/window,
# drag to resize panes and to select text (enters copy-mode automatically).
set -g mouse on

# vi-style navigation and selection in copy-mode (prefix + [).
set -g mode-keys vi

# Forward copy-mode yanks (and mouse-drag selections) to the terminal via
# OSC52, so they land on the system clipboard on terminals that support it.
set -g set-clipboard on
