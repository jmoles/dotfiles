name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chezmoi-verify:
    name: Verify chezmoi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          for i in 1 2 3; do
            sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/chezmoi" --version

      - name: Test apply (dry-run)
        run: chezmoi apply --dry-run --verbose --source="${{ github.workspace }}"

  secret-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: anything ever pushed to this public repo is exposed.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck (bash scripts; fails the build)
        run: |
          # The git/gh wrappers have no .sh extension, so list them explicitly.
          # Templates are excluded: they aren't valid shell until rendered.
          find . -type f -name "*.sh" ! -name "*.tmpl" -not -path './.git/*' \
            -exec shellcheck --shell=bash --severity=warning {} +
          shellcheck --shell=bash --severity=warning \
            private_dot_local/bin/executable_git \
            private_dot_local/bin/executable_gh

      - name: Run shellcheck (zsh files; advisory)
        # zsh isn't bash, and Oh My Zsh variables (ZSH_THEME, plugins, ...)
        # look unused to shellcheck, so findings here don't fail the build.
        run: |
          find . -type f \( -name "*.zsh" -o -name "dot_zshrc" \) ! -name "*.tmpl" \
            -not -path './.git/*' \
            -exec shellcheck --shell=bash --severity=warning {} + || true

  guardrail-tests:
    name: Guardrail tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          for i in 1 2 3; do
            sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" && break
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Hermetic: stub git/gh, throwaway HOME, no network. Covers the hook,
      # the wrappers, and the permission rules the settings template emits.
      - name: Hook and wrapper tests
        run: bash tests/guardrail-test.sh

      - name: Permission rule tests
        run: bash tests/permissions-test.sh

  config-validate:
    name: Validate TOML/JSON files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TOML files
        run: |
          for file in $(find . -name "*.toml" -type f); do
            echo "Validating $file..."
            python3 -c "import tomllib; tomllib.load(open('$file', 'rb'))"
          done

      - name: Validate JSON files
        run: |
          # modify_ files are chezmoi templates that output JSON, not JSON.
          for file in $(find . -name "*.json" -type f ! -path "./.git/*" ! -name "modify_*"); do
            echo "Validating $file..."
            python3 -m json.tool "$file" > /dev/null
          done
